# NexT Theme Configuration
# Docs: https://theme-next.js.org/docs/

# ---------------------------------------------------------------
# Scheme Settings
# ---------------------------------------------------------------
scheme: Gemini
darkmode: false

# Custom files
custom_file_path:
  style: source/_data/styles.styl

# ---------------------------------------------------------------
# Menu Settings
# ---------------------------------------------------------------
menu:
  home: / || fa fa-home
  categories: /categories/ || fa fa-th
  archives: /archives/ || fa fa-archive
  tags: /tags/ || fa fa-tags

menu_settings:
  icons: true
  badges: true

# ---------------------------------------------------------------
# Sidebar Settings
# ---------------------------------------------------------------
sidebar:
  position: left
  display: post

# Posts / Categories / Tags in sidebar
site_state: true

# Table of Contents in the Sidebar
toc:
  enable: true
  number: true
  wrap: true
  expand_all: false
  max_depth: 4

# ---------------------------------------------------------------
# Footer Settings
# ---------------------------------------------------------------
footer:
  powered: true

# ---------------------------------------------------------------
# Post Settings
# ---------------------------------------------------------------
excerpt_description: true
read_more_btn: true

post_meta:
  item_text: true
  created_at: true
  updated_at:
    enable: true
    another_day: true
  categories: true

tag_icon: true

# ---------------------------------------------------------------
# Misc Theme Settings
# ---------------------------------------------------------------
# Code block
codeblock:
  theme:
    light: default
    dark: stackoverflow-dark
  copy_button:
    enable: true
    style: flat
  fold:
    enable: true
    height: 500
  language: true

# Back to top
back2top:
  enable: true
  sidebar: false
  scrollpercent: true

# Reading progress bar
reading_progress:
  enable: true
  start_at: left
  position: top
  reversed: false
  color: "#37c6c0"
  height: 3px

# ---------------------------------------------------------------
# Font Settings
# ---------------------------------------------------------------
font:
  enable: false

# ---------------------------------------------------------------
# SEO Settings
# ---------------------------------------------------------------
index_with_subtitle: false

# Auto encode external URLs with Base64 for SEO (nofollow)
exturl: true

# Open Graph
open_graph:
  enable: true

# ---------------------------------------------------------------
# Animation Settings
# ---------------------------------------------------------------
motion:
  enable: true
  async: false
  duration: 200
  transition:
    menu_item: fadeInDown
    post_block: fadeIn
    post_header: fadeInDown
    post_body: fadeInDown
    coll_header: fadeInLeft
    sidebar: fadeInUp

# ---------------------------------------------------------------
# Search Settings
# ---------------------------------------------------------------
local_search:
  enable: true
  top_n_per_article: 3
  unescape: true
  preload: false

# ---------------------------------------------------------------
# CDN Settings
# ---------------------------------------------------------------
vendors:
  internal: local
  plugins: cdnjs

an></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;cstdio&gt;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;fcntl.h&gt;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;netinet/in.h&gt;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;csignal&gt;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;cstring&gt;</span></span></span><br><span class="line"></span><br><span class="line"><span class="function"><span class="type">int</span> <span class="title">main</span><span class="params">()</span></span></span><br><span class="line"><span class="function"></span>&#123;</span><br><span class="line">    <span class="comment">//创建监听套接字</span></span><br><span class="line">    <span class="type">int</span> listenfd = <span class="built_in">socket</span>(AF_INET,SOCK_STREAM,<span class="number">0</span>);</span><br><span class="line">    <span class="keyword">if</span>(listenfd == <span class="number">-1</span>)</span><br><span class="line">    &#123;</span><br><span class="line">        <span class="built_in">perror</span>(<span class="string">&quot;socket&quot;</span>);</span><br><span class="line">        <span class="built_in">exit</span>(EXIT_FAILURE);</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="comment">//设置端口复用</span></span><br><span class="line">    <span class="type">int</span> opt = <span class="number">1</span>;</span><br><span class="line">    <span class="keyword">if</span>(<span class="built_in">setsockopt</span>(listenfd, SOL_SOCKET, SO_REUSEADDR, &amp;opt, <span class="built_in">sizeof</span>(opt))==<span class="number">-1</span>)</span><br><span class="line">    &#123;</span><br><span class="line">        <span class="built_in">perror</span>(<span class="string">&quot;setsockopt&quot;</span>);</span><br><span class="line">        <span class="built_in">close</span>(listenfd);</span><br><span class="line">        <span class="keyword">return</span> EXIT_FAILURE;</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="comment">//将监听套接字设置为非阻塞</span></span><br><span class="line">    <span class="type">int</span> flag = <span class="built_in">fcntl</span>(listenfd,F_GETFL,<span class="number">0</span>);</span><br><span class="line">    <span class="keyword">if</span> (flag == <span class="number">-1</span>) &#123;</span><br><span class="line">        <span class="built_in">perror</span>(<span class="string">&quot;fcntl F_GETFL&quot;</span>);</span><br><span class="line">        <span class="built_in">close</span>(listenfd);</span><br><span class="line">        <span class="keyword">return</span> EXIT_FAILURE;</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">if</span> (<span class="built_in">fcntl</span>(listenfd, F_SETFL, flag | O_NONBLOCK) == <span class="number">-1</span>) &#123;</span><br><span class="line">        <span class="built_in">perror</span>(<span class="string">&quot;fcntl F_SETFL&quot;</span>);</span><br><span class="line">        <span class="built_in">close</span>(listenfd);</span><br><span class="line">        <span class="keyword">return</span> EXIT_FAILURE;</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="comment">//绑定端口</span></span><br><span class="line">    sockaddr_in serverAddr&#123;&#125;;</span><br><span class="line">    serverAddr.sin_family = AF_INET;</span><br><span class="line">    serverAddr.sin_addr.s_addr = <span class="built_in">htonl</span>(INADDR_ANY);</span><br><span class="line">    serverAddr.sin_port = <span class="built_in">htons</span>(<span class="number">12332</span>);</span><br><span class="line"></span><br><span class="line">    <span class="keyword">if</span> (<span class="built_in">bind</span>(listenfd, <span class="built_in">reinterpret_cast</span>&lt;sockaddr*&gt;(&amp;serverAddr), <span class="built_in">sizeof</span>(serverAddr)) == <span class="number">-1</span>) &#123;</span><br><span class="line">        <span class="built_in">perror</span>(<span class="string">&quot;bind&quot;</span>);</span><br><span class="line">        <span class="built_in">close</span>(listenfd);</span><br><span class="line">        <span class="keyword">return</span> EXIT_FAILURE;</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="comment">//开始监听</span></span><br><span class="line">    <span class="keyword">if</span> (<span class="built_in">listen</span>(listenfd, SOMAXCONN) == <span class="number">-1</span>) &#123;</span><br><span class="line">        <span class="built_in">perror</span>(<span class="string">&quot;listen&quot;</span>);</span><br><span class="line">        <span class="built_in">close</span>(listenfd);</span><br><span class="line">        <span class="keyword">return</span> EXIT_FAILURE;</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="comment">//创建epoll实例</span></span><br><span class="line">    <span class="type">int</span> epollfd = <span class="built_in">epoll_create1</span>(<span class="number">0</span>);</span><br><span class="line">    <span class="keyword">if</span>(epollfd == <span class="number">-1</span>)</span><br><span class="line">    &#123;</span><br><span class="line">        <span class="built_in">perror</span>(<span class="string">&quot;epoll_create&quot;</span>);</span><br><span class="line">        <span class="keyword">return</span> EXIT_FAILURE;</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="comment">//将监听描述服放到epoll树上</span></span><br><span class="line">    epoll_event event;</span><br><span class="line">    event.events = EPOLLIN|EPOLLET;</span><br><span class="line">    event.data.fd = listenfd;</span><br><span class="line">    <span class="keyword">if</span> (<span class="built_in">epoll_ctl</span>(epollfd, EPOLL_CTL_ADD, listenfd, &amp;event) == <span class="number">-1</span>) &#123;</span><br><span class="line">        <span class="built_in">perror</span>(<span class="string">&quot;epoll_ctl listenfd&quot;</span>);</span><br><span class="line">        <span class="built_in">close</span>(listenfd);</span><br><span class="line">        <span class="built_in">close</span>(epollfd);</span><br><span class="line">        <span class="keyword">return</span> EXIT_FAILURE;</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="comment">//创建事件数组</span></span><br><span class="line">    epoll_event events[<span class="number">1024</span>];</span><br><span class="line">    <span class="type">int</span> count = <span class="number">0</span>;</span><br><span class="line">    <span class="keyword">while</span>(<span class="literal">true</span>)</span><br><span class="line">    &#123;</span><br><span class="line">        count = <span class="built_in">epoll_wait</span>(epollfd,events,<span class="number">1024</span>,<span class="number">-1</span>);</span><br><span class="line">        <span class="keyword">for</span>(<span class="type">int</span> i = <span class="number">0</span>; i &lt; count; ++i)</span><br><span class="line">        &#123;</span><br><span class="line">            <span class="keyword">if</span>(events[i].data.fd == listenfd)</span><br><span class="line">            &#123;</span><br><span class="line">                <span class="comment">//建立连接</span></span><br><span class="line">                sockaddr_in clientAddr&#123;&#125;;</span><br><span class="line">                <span class="type">socklen_t</span> clientsize = <span class="built_in">sizeof</span>(clientAddr);</span><br><span class="line">                <span class="type">int</span> clientfd = <span class="built_in">accept</span>(listenfd,<span class="built_in">reinterpret_cast</span>&lt;sockaddr*&gt;(&amp;clientAddr),&amp;clientsize);</span><br><span class="line">                <span class="keyword">if</span> (clientfd == <span class="number">-1</span>) &#123;</span><br><span class="line">                    <span class="keyword">if</span> (errno == EAGAIN || errno == EWOULDBLOCK) <span class="keyword">break</span>;</span><br><span class="line">                    <span class="built_in">perror</span>(<span class="string">&quot;accept&quot;</span>);</span><br><span class="line">                    <span class="keyword">continue</span>;</span><br><span class="line">                &#125;</span><br><span class="line">                <span class="comment">//将客户端的文件描述服设置为非阻塞</span></span><br><span class="line">                <span class="type">int</span> clientFlags = <span class="built_in">fcntl</span>(clientfd, F_GETFL,<span class="number">0</span>);</span><br><span class="line">                <span class="keyword">if</span> (clientFlags == <span class="number">-1</span>) &#123;</span><br><span class="line">                    <span class="built_in">perror</span>(<span class="string">&quot;fcntl F_GETFL&quot;</span>);</span><br><span class="line">                    <span class="built_in">close</span>(listenfd);</span><br><span class="line">                    <span class="keyword">continue</span>;</span><br><span class="line">                &#125;</span><br><span class="line">                <span class="keyword">if</span> (<span class="built_in">fcntl</span>(clientfd, F_SETFL, clientFlags | O_NONBLOCK) == <span class="number">-1</span>) &#123;</span><br><span class="line">                    <span class="built_in">perror</span>(<span class="string">&quot;fcntl client&quot;</span>);</span><br><span class="line">                    <span class="built_in">close</span>(clientfd);</span><br><span class="line">                    <span class="keyword">continue</span>;</span><br><span class="line">                &#125;</span><br><span class="line">                <span class="comment">//将监听描述服上树</span></span><br><span class="line">                epoll_event clientEvent&#123;&#125;;</span><br><span class="line">                clientEvent.events = EPOLLIN|EPOLLET|EPOLLRDHUP;</span><br><span class="line">                clientEvent.data.fd = clientfd;</span><br><span class="line">                <span class="keyword">if</span> (<span class="built_in">epoll_ctl</span>(epollfd, EPOLL_CTL_ADD, clientfd, &amp;clientEvent) == <span class="number">-1</span>) &#123;</span><br><span class="line">                    <span class="built_in">perror</span>(<span class="string">&quot;epoll_ctl client&quot;</span>);</span><br><span class="line">                    <span class="built_in">close</span>(clientfd);</span><br><span class="line">                &#125;</span><br><span class="line">            &#125;</span><br><span class="line">            <span class="keyword">else</span>&#123;</span><br><span class="line">                <span class="type">int</span> clientfd = events[i].data.fd;</span><br><span class="line">                <span class="comment">//EPOLLERR 和 EPOLLHUP 事件如果发生，总是会被报告，无论这些事件是否在 events 中被指定</span></span><br><span class="line">                <span class="keyword">if</span>(events[i].events &amp; (EPOLLRDHUP | EPOLLHUP | EPOLLERR)) &#123;</span><br><span class="line">                    <span class="built_in">printf</span>(<span class="string">&quot;Client %d disconnected abnormally\n&quot;</span>, clientfd);</span><br><span class="line">                    <span class="built_in">epoll_ctl</span>(epollfd, EPOLL_CTL_DEL, clientfd, <span class="literal">nullptr</span>);</span><br><span class="line">                    <span class="built_in">close</span>(clientfd);</span><br><span class="line">                    <span class="keyword">continue</span>;</span><br><span class="line">                &#125;</span><br><span class="line">                <span class="comment">// 循环读取全部数据（边缘触发模式必须）</span></span><br><span class="line">                <span class="keyword">while</span>(<span class="number">1</span>) &#123;</span><br><span class="line">                    <span class="type">char</span> buffer[<span class="number">1024</span>];</span><br><span class="line">                    <span class="type">ssize_t</span> num_bytes = <span class="built_in">recv</span>(clientfd, buffer, <span class="built_in">sizeof</span>(buffer), <span class="number">0</span>);</span><br><span class="line">                    </span><br><span class="line">                    <span class="keyword">if</span>(num_bytes &gt; <span class="number">0</span>) &#123;</span><br><span class="line">                        buffer[num_bytes] = <span class="string">&#x27;\0&#x27;</span>;</span><br><span class="line">                        <span class="built_in">printf</span>(<span class="string">&quot;Received %zd bytes from client %d: %s\n&quot;</span>, </span><br><span class="line">                            num_bytes, clientfd, buffer);</span><br><span class="line">                    &#125;</span><br><span class="line">                    <span class="keyword">else</span> <span class="keyword">if</span>(num_bytes == <span class="number">0</span>) &#123;</span><br><span class="line">                        <span class="built_in">printf</span>(<span class="string">&quot;Connection closed by client: %d\n&quot;</span>, clientfd);</span><br><span class="line">                        <span class="built_in">epoll_ctl</span>(epollfd, EPOLL_CTL_DEL, clientfd, <span class="literal">nullptr</span>);</span><br><span class="line">                        <span class="built_in">close</span>(clientfd);</span><br><span class="line">                        <span class="keyword">break</span>;</span><br><span class="line">                    &#125;</span><br><span class="line">                    <span class="keyword">else</span> &#123;  <span class="comment">// num_bytes == -1</span></span><br><span class="line">                        <span class="keyword">if</span>(errno == EAGAIN || errno == EWOULDBLOCK) &#123;</span><br><span class="line">                            <span class="comment">// 数据读取完毕</span></span><br><span class="line">                            <span class="built_in">printf</span>(<span class="string">&quot;EAGAIN/EWOULDBLOCK encountered for client %d - no more data to read\n&quot;</span>, clientfd);</span><br><span class="line">                            <span class="keyword">break</span>;</span><br><span class="line">                        &#125;</span><br><span class="line">                        <span class="built_in">perror</span>(<span class="string">&quot;recv&quot;</span>);</span><br><span class="line">                        <span class="built_in">epoll_ctl</span>(epollfd, EPOLL_CTL_DEL, clientfd, <span class="literal">nullptr</span>);</span><br><span class="line">                        <span class="built_in">close</span>(clientfd);</span><br><span class="line">                        <span class="keyword">break</span>;</span><br><span class="line">                    &#125;</span><br><span class="line">                &#125;</span><br><span class="line">            &#125;</span><br><span class="line">        &#125;</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="built_in">close</span>(listenfd);</span><br><span class="line">    <span class="built_in">close</span>(epollfd);</span><br><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>
